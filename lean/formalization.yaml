version: v0.4
project:
  name: "The Alon–Tarsi (1992) conjecture: for n > 2, congruences modulo divisors of (n!)^3 can prove it only at Drisko's orders"
  description: "Unconditional Lean 4 formalization of Theorems A, B, and C (and all 43 claims) of \"The Alon–Tarsi (1992) conjecture: for n > 2, congruences modulo divisors of (n!)^3 can prove it only at Drisko's orders\": for every even n >= 8, the obstruction integer c_n = (n!)^3 / gcd(|Δ_n|, (n!)^3) equals n - 1 when n - 1 is prime and 1 otherwise (Theorem A); for every even n >= 8 and prime q <= n - 2, the natural modulus M_q(n) = q^(v_q(n!) + v_q(n)) divides the reduced signed count D_n (Theorem B); and for every even n and prime q, the q-adic valuation of Δ_n = L^e_n - L^o_n satisfies v_q(Δ_n) >= v_q((n - 1)!) + sum_{N=1}^{n-1} f_q(n, N) >= v_q(n!(n - 1)!) + a(a - 1)/2 for a = floor(n/q), and at least v_2((n - 1)!) + n^2/4 for q = 2 (Theorem C). Both external results cited in the paper (Stones–Wanless 2012 Theorem 3.5 and Drisko 1997 Theorem 1) are proved directly from Lean's three standard axioms alone."
